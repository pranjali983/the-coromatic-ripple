<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chromatic Ripple</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            cursor: none;
        }
        canvas {
            display: block;
        }
        #hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-family: sans-serif;
            letter-spacing: 2px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="hint">MOVE TO CREATE RIPPLES • CLICK TO SHIFT COLORS</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let points = [];
        let hue = 200;
        const mouse = { x: -1000, y: -1000 };

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            points = [];
            
            // Create a grid of points
            const spacing = 30;
            for (let x = 0; x < width + spacing; x += spacing) {
                for (let y = 0; y < height + spacing; y += spacing) {
                    points.push({
                        baseX: x,
                        baseY: y,
                        x: x,
                        y: y,
                        vx: 0,
                        vy: 0
                    });
                }
            }
        }

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mousedown', () => {
            hue = Math.random() * 360;
        });

        window.addEventListener('resize', init);

        function update() {
            points.forEach(p => {
                const dx = mouse.x - p.x;
                const dy = mouse.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const force = Math.max(0, (150 - dist) / 150);

                // Push points away from mouse
                if (dist < 150) {
                    const angle = Math.atan2(dy, dx);
                    p.vx -= Math.cos(angle) * force * 5;
                    p.vy -= Math.sin(angle) * force * 5;
                }

                // Spring back to original position
                p.vx += (p.baseX - p.x) * 0.05;
                p.vy += (p.baseY - p.y) * 0.05;

                // Friction
                p.vx *= 0.9;
                p.vy *= 0.9;

                p.x += p.vx;
                p.y += p.vy;
            });
        }

        function draw() {
            // Dark trail effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            points.forEach(p => {
                const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                const brightness = Math.min(100, speed * 10 + 20);
                
                ctx.fillStyle = `hsla(${hue + speed * 5}, 80%, ${brightness}%, 0.8)`;
                
                // Draw small diamonds
                ctx.beginPath();
                ctx.moveTo(p.x, p.y - 2);
                ctx.lineTo(p.x + 2, p.y);
                ctx.lineTo(p.x, p.y + 2);
                ctx.lineTo(p.x - 2, p.y);
                ctx.fill();
            });

            // Mouse Glow
            const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 100);
            gradient.addColorStop(0, `hsla(${hue}, 100%, 50%, 0.2)`);
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            update();
            requestAnimationFrame(draw);
        }

        init();
        draw();
    </script>
</body>
</html>
